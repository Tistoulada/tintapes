<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPERWEEKEND — TinTapes</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000}
    body{color:#fff;font-family:monospace;touch-action:none;user-select:none;-webkit-user-select:none}
    a.back{position:fixed;top:14px;left:14px;color:#aaa;text-decoration:none;z-index:5}
    #screen{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair}

    #moto{position:fixed;left:0;top:0;width:64px;height:64px;image-rendering:pixelated;pointer-events:none;
          z-index:2;display:none;will-change:transform}

    /* player : sur la route, pour qu'on doive y emmener le scooter */
    .player{position:fixed;right:24px;bottom:24px;z-index:3;width:300px;padding:1rem 1rem .8rem;box-sizing:border-box;
            background:rgba(0,0,0,.35);border:1px solid #39ff88;
            box-shadow:0 0 14px rgba(57,255,136,.25),inset 0 0 14px rgba(57,255,136,.08);
            opacity:0;pointer-events:none;transition:opacity 1.2s ease;text-shadow:0 0 4px #000}
    .player.show{opacity:1;pointer-events:auto}
    .player h1{margin:0 0 .8rem;font-size:1rem;letter-spacing:.3em;color:#39ff88;text-shadow:0 0 8px #39ff88}
    ol{list-style:none;margin:0 0 .9rem;padding:0}
    li{display:flex;gap:.7rem;padding:.35rem .4rem;cursor:pointer;color:#ccc;border-left:2px solid transparent;font-size:.85rem}
    li:hover{color:#fff;background:rgba(255,63,164,.08)}
    li .n{color:#666}
    li .t{flex:1;text-align:left}
    li .d{color:#666}
    li.on{color:#fff;border-left-color:#ff3fa4}
    li.on .n{color:#ff3fa4}
    li.off{opacity:.45}
    .bar{font-size:.8rem;line-height:1;white-space:nowrap;overflow:hidden;cursor:pointer;color:#444;text-align:center}
    .bar .done{color:#ff3fa4}
    .ctrl{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-top:.7rem;color:#999;font-size:.8rem}
    .ctrl button{background:none;border:1px solid #39ff88;color:#fff;font:inherit;padding:.25rem .6rem;cursor:pointer}
    .ctrl button:hover{background:rgba(57,255,136,.12)}
    .time{min-width:7.5em;text-align:center}
    @media (max-width:700px){
      .player{left:10px;right:10px;bottom:10px;width:auto;padding:.7rem .8rem .6rem}
      .player h1{margin-bottom:.4rem}
      li{padding:.25rem .4rem}
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← TinTapes</a>
  <canvas id="screen"></canvas>
  <img id="moto" src="moto.gif" alt="">

  <main class="player" id="player">
    <h1>SUPERWEEKEND</h1>
    <ol id="list"></ol>
    <div class="bar" id="bar"></div>
    <div class="ctrl">
      <button id="prev" aria-label="Précédent">◀◀</button>
      <button id="play" aria-label="Lecture">▶</button>
      <button id="next" aria-label="Suivant">▶▶</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </main>

  <script>
    /* === Morceaux : mettre les MP3 dans le dossier code/superweekend/ et changer les titres ici === */
    const TRACKS = [
      { title: "Titre 1", file: "superweekend/01.mp3" },
      { title: "Titre 2", file: "superweekend/02.mp3" },
      { title: "Titre 3", file: "superweekend/03.mp3" },
      { title: "Titre 4", file: "superweekend/04.mp3" }
    ];

    const audio = document.getElementById('audio');
    const list  = document.getElementById('list');
    const bar   = document.getElementById('bar');
    const playB = document.getElementById('play');
    const timeEl = document.getElementById('time');
    const BAR_LEN = 26;
    let current = -1;
    audio.preservesPitch = audio.mozPreservesPitch = audio.webkitPreservesPitch = false;   // pour l'effet cassette qui accroche

    const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';

    TRACKS.forEach((tr, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t"></span><span class="d"></span>`;
      li.querySelector('.t').textContent = tr.title;
      li.addEventListener('click', () => i === current ? toggle() : load(i, true));
      list.appendChild(li);
      const probe = new Audio();
      probe.preload = 'metadata';
      probe.addEventListener('loadedmetadata', () => li.querySelector('.d').textContent = fmt(probe.duration));
      probe.addEventListener('error', () => { li.classList.add('off'); li.querySelector('.d').textContent = 'bientôt'; });
      probe.src = tr.file;
    });

    function load(i, autoplay){
      current = (i + TRACKS.length) % TRACKS.length;
      [...list.children].forEach((li, k) => li.classList.toggle('on', k === current));
      audio.src = TRACKS[current].file;
      if(autoplay) audio.play().catch(() => {});
      drawBar();
    }
    function toggle(){
      if(current < 0) return load(0, true);
      audio.paused ? audio.play().catch(() => {}) : audio.pause();
    }
    function drawBar(){
      const r = audio.duration ? audio.currentTime / audio.duration : 0;
      const n = Math.round(r * BAR_LEN);
      bar.innerHTML = `<span class="done">${'▓'.repeat(n)}</span>${'░'.repeat(BAR_LEN - n)}`;
      timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
    }
    playB.addEventListener('click', toggle);
    document.getElementById('prev').addEventListener('click', () => load(current - 1, true));
    document.getElementById('next').addEventListener('click', () => load(current + 1, true));
    bar.addEventListener('click', e => {
      if(!audio.duration) return;
      const r = bar.getBoundingClientRect();
      audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
    });
    audio.addEventListener('timeupdate', drawBar);
    audio.addEventListener('loadedmetadata', drawBar);
    audio.addEventListener('play',  () => playB.textContent = '❚❚');
    audio.addEventListener('pause', () => playB.textContent = '▶');
    audio.addEventListener('ended', () => load(current + 1, true));
    drawBar();
  </script>

  <script>
    /* === Le miroir se brise, chaque éclat montre une autre vie ; on clique dedans et la course commence.
           Le scooter suit la souris (ou le doigt) ; un crash brise l'écran et projette dans une autre vie. === */
    const cv = document.getElementById('screen'), ctx = cv.getContext('2d');
    const moto = document.getElementById('moto');
    const playerEl = document.getElementById('player');
    const FONT = 'Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace';

    const h = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
    const mod = (a, n) => ((a % n) + n) % n;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    let OC = ' ', OK = '';                                     // sortie des fonctions de décor : caractère + couleur
    const out = (ch, col) => { OC = ch; OK = col; };

    /* ---------- grille ASCII et cache de glyphes ---------- */
    let W, H, dpr, fs, cw, chH, C, R, grid, gcol, roadL, roadR;
    const atlas = document.createElement('canvas'), actx = atlas.getContext('2d');
    const glyphs = new Map(), AC = 48, PAD = 2;
    let gw, gh, GW, GH;

    function setup(){
      dpr = Math.min(2, devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      fs = clamp(Math.round(W / 95), 10, 15);
      ctx.font = fs + 'px ' + FONT;
      cw = ctx.measureText('M').width; chH = Math.round(fs * 1.2);
      C = Math.ceil(W / cw) + 1; R = Math.ceil(H / chH) + 2;
      grid = new Array(C * R).fill(' '); gcol = new Array(C * R).fill('');
      const narrow = W < 700;
      roadL = Math.floor(C * (narrow ? 0.12 : 0.28));
      roadR = Math.ceil(C * (narrow ? 0.88 : 0.72));
      gw = Math.ceil(cw * dpr); gh = Math.ceil(chH * dpr); GW = gw + PAD * 2; GH = gh + PAD * 2;
      atlas.width = GW * AC; atlas.height = GH * AC; glyphs.clear();
      MS = narrow ? 56 : 76;
      moto.style.width = moto.style.height = MS + 'px';
      buildMirror();
    }

    function glyph(ch, col){
      const k = ch + col;
      let i = glyphs.get(k);
      if(i === undefined){
        if(glyphs.size >= AC * AC){ glyphs.clear(); actx.clearRect(0, 0, atlas.width, atlas.height); }
        i = glyphs.size;
        actx.font = (fs * dpr) + 'px ' + FONT; actx.textBaseline = 'middle'; actx.fillStyle = col;
        actx.fillText(ch, (i % AC) * GW + PAD, ((i / AC) | 0) * GH + PAD + gh / 2);
        glyphs.set(k, i);
      }
      return i;
    }
    const set = (c, r, ch, col) => { if(c >= 0 && c < C && r >= 0 && r < R){ grid[r * C + c] = ch; gcol[r * C + c] = col; } };

    function flush(xOff, yOff){
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const cwd = cw * dpr, chd = chH * dpr, xo = xOff * dpr, yo = yOff * dpr;
      for(let r = 0; r < R; r++) for(let c = 0; c < C; c++){
        const i = r * C + c, ch = grid[i];
        if(ch === ' ') continue;
        const g = glyph(ch, gcol[i]);
        ctx.drawImage(atlas, (g % AC) * GW + PAD, ((g / AC) | 0) * GH + PAD, gw, gh,
                      Math.round(c * cwd + xo), Math.round(r * chd + yo), gw, gh);
      }
      grid.fill(' ');
    }
    function text(str, c, r, col){ for(let k = 0; k < str.length; k++) set(c + k, r, str[k], col); }

    /* ---------- les vies : chaque décor de course ---------- */
    const OBST = {
      tuktuk:   { s:[" ▄▄▄ ", "▐█▀█▌", " ▀ ▀ "], col:'#ff3fa4', kind:'veh' },
      taxiPink: { s:["▄▀▀▄", "█▄▄█", "█▀▀█", "▀  ▀"], col:'#ff7fd0', kind:'veh' },
      taxi:     { s:["▄▀▀▄", "█▄▄█", "█▀▀█", "▀  ▀"], col:'#ffd23f', kind:'veh' },
      bus:      { s:["▄▄▄▄", "█▒▒█", "█▒▒█", "█▒▒█", "▀  ▀"], col:'#3f8fe0', kind:'veh' },
      truck:    { s:["████", "█▀▀█", "████", "████", "▀  ▀"], col:'#d04a30', kind:'veh' },
      bike:     { s:["o─o"], col:'#9ab8d0', kind:'veh' },
      cart:     { s:["┌──┐", "│≈≈│", "o──o"], col:'#ff9a3c', kind:'static' },
      pothole:  { s:["(@@)"], col:'#6a6a6a', kind:'static' },
      rock:     { s:["▄█▄", "███"], col:'#8a5a34', kind:'static' },
      boulder:  { s:["▄██▄", "▀██▀"], col:'#8a8a92', kind:'static' },
      coconut:  { s:["(●)"], col:'#a07a40', kind:'static' },
      buffalo:  { s:["▄██▄", "████", "▀  ▀"], col:'#9a9a9a', kind:'static' },
      dog:      { s:["▄▀▄", "▀█▀"], col:'#d0a070', kind:'cross' },
      chicken:  { s:["<'>"], col:'#f0f0e0', kind:'cross' },
      tumble:   { s:["(@)"], col:'#c09050', kind:'cross' },
      crab:     { s:["\\ö/"], col:'#ff6040', kind:'cross' },
      umbrella: { s:["╭─╮", " │ "], col:'#c040ff', kind:'cross' },
      goat:     { s:["^_^", "▀▀▀"], col:'#e0e0e0', kind:'cross' }
    };

    const THEMES = [
      { // Bangkok la nuit
        bg:'#06030b', edge:['║', '#7a3a8a'], lane:'#d0d0d0', dust:'#3a3048', accent:'#ff3fa4', lanes:3, narrow:0,
        obst:['tuktuk', 'taxiPink', 'cart', 'dog', 'pothole'],
        decor(c, w, t){
          if(c === roadL - 2 || c === roadR + 1){ h(c, Math.floor(w / 4)) < 0.18 ? out('▣', '#ff9a3c') : out('░', '#3a2f4a'); return; }
          const bx = Math.floor(c / 7), by = Math.floor(w / 6), lx = mod(c, 7), ly = mod(w, 6);
          if(lx === 0 || ly === 0){ out(h(c, w) < 0.05 ? '·' : ' ', '#2a2238'); return; }
          const v = h(bx, by);
          if(v > 0.55 && ly === 2 && lx <= 5){
            const on = h(bx, by + Math.floor(t * 4)) > 0.15;
            out('▬', on ? (v > 0.78 ? '#ff3fa4' : '#3fe0ff') : '#40203a'); return;
          }
          out('▒', v < 0.33 ? '#2a1e3a' : v < 0.66 ? '#1e2440' : '#331c34');
        }
      },
      { // Rizières
        bg:'#071006', edge:[':', '#8a6a3a'], lane:'#8a6a3a', dust:'#6b5536', accent:'#86cf5a', lanes:1, narrow:2,
        obst:['buffalo', 'chicken', 'cart', 'pothole', 'bike'],
        decor(c, w, t){
          if(c === roadL - 2 || c === roadR + 1){ out(h(c, w) < 0.4 ? '.' : ' ', '#8a6a3a'); return; }
          if(h(Math.floor(c / 5), Math.floor(w / 5)) < 0.05 && mod(c, 5) === 2 && mod(w, 5) === 2){ out('¥', '#3f9f3a'); return; }
          if(mod(w + Math.floor(c / 9) * 2, 4) === 0){ out(mod(c + Math.floor(t * 3), 3) === 0 ? '~' : '-', '#2f7f8a'); return; }
          out(h(c, w) < 0.5 ? 'ψ' : '"', h(c + 1, w) < 0.5 ? '#5fae4a' : '#86cf5a');
        }
      },
      { // Désert
        bg:'#120803', edge:['│', '#a08060'], lane:'#f0c040', dust:'#4a3a30', accent:'#ff9a3c', lanes:2, narrow:1,
        obst:['truck', 'rock', 'tumble', 'pothole'],
        decor(c, w, t){
          const v = h(c, w);
          if(v < 0.012){ out('Ψ', '#5a9a4a'); return; }
          if(v < 0.022){ out('▲', '#7a5030'); return; }
          if(Math.sin(c * 0.23 + w * 0.11) > 0.86){ out('~', '#e09a50'); return; }
          out(v < 0.45 ? '.' : v < 0.6 ? ',' : ' ', v < 0.2 ? '#d08040' : '#a8642c');
        }
      },
      { // Bord de mer
        bg:'#020810', edge:['│', '#8aaabb'], lane:'#e0e0e0', dust:'#34404c', accent:'#4aa8e0', lanes:2, narrow:0, previewLeft:true,
        obst:['bike', 'crab', 'coconut', 'tuktuk'],
        decor(c, w, t){
          if(c < roadL - 1){
            if(c >= roadL - 3){ out(mod(w + Math.floor(t * 4), 3) ? '°' : '~', '#cfe6f7'); return; }
            const k = Math.sin(c * 0.5 + w * 0.3 + t * 2);
            out(k > 0.3 ? '≈' : '~', k > 0.7 ? '#4aa8e0' : '#2a6aa8'); return;
          }
          const v = h(c, w);
          if(v < 0.035){ out('¥', '#3fbf6a'); return; }
          out(v < 0.3 ? '.' : ' ', '#d8c08a');
        }
      },
      { // Ville sous la pluie
        bg:'#04060a', edge:['║', '#4a5a6a'], lane:'#c0c8d0', dust:'#2a3038', accent:'#ffd23f', lanes:3, narrow:0,
        obst:['taxi', 'bus', 'umbrella', 'pothole'],
        decor(c, w, t){
          if(c === roadL - 2 || c === roadR + 1){ out('░', '#2a3038'); return; }
          const bx = Math.floor(c / 6), by = Math.floor(w / 5), lx = mod(c, 6), ly = mod(w, 5);
          if(lx === 0 || ly === 0){ out(' ', ''); return; }
          if(h(c, w) < 0.07){ out('▪', h(bx, by + Math.floor(t * 0.5)) > 0.3 ? '#d8c060' : '#3a3a2a'); return; }
          out('▓', h(bx, by) < 0.5 ? '#3a4250' : '#2c333e');
        },
        roadFx(c, w){ if(h(c * 3, w) < 0.015){ out('○', '#3a6a9a'); return true; } return false; },
        overlay(c, r, t){ if(h(c, r - Math.floor(t * 30)) < 0.03){ out('/', '#6a8ab0'); return true; } return false; }
      },
      { // Montagne dans la brume
        bg:'#060709', edge:['│', '#6a6a72'], lane:'#d0d0d0', dust:'#30323a', accent:'#e8eef5', lanes:2, narrow:3,
        obst:['goat', 'boulder', 'truck', 'rock'],
        decor(c, w, t){
          const n = Math.sin(c * 0.31) * Math.cos(w * 0.27) + h(c, w) * 0.6;
          if(n > 0.9){ out('▲', '#a0a0ac'); return; }
          if(n > 0.75){ out('*', '#e8eef5'); return; }
          out(h(c, w) < 0.15 ? ',' : ' ', '#3a5a3a');
        },
        overlay(c, r, t){ if(Math.sin(c * 0.09 + t * 0.4) + Math.sin(r * 0.17 - t * 0.3) > 1.35){ out('░', '#5a606c'); return true; } return false; }
      }
    ];

    // une case du décor de course (c : colonne écran, w : ligne « monde » qui défile)
    function raceCell(th, c, w, r, t){
      if(th.overlay && th.overlay(c, r, t)) return;
      const L = roadL + th.narrow, Rr = roadR - th.narrow;
      if(c === L - 1 || c === Rr){ out(th.edge[0], th.edge[1]); return; }
      if(c >= L && c < Rr){
        const lw = (Rr - L) / th.lanes;
        for(let k = 1; k < th.lanes; k++) if(c === Math.round(L + k * lw) && mod(w, 4) < 2){ out('¦', th.lane); return; }
        if(th.roadFx && th.roadFx(c, w)) return;
        out(h(c, w) < 0.05 ? '·' : ' ', th.dust); return;
      }
      th.decor(c, w, t);
    }

    /* ---------- le miroir ---------- */
    const FACE = [
      "        .-~~~~~~~-.        ",
      "      .'           '.      ",
      "     /   _________   \\     ",
      "    |   /         \\   |    ",
      "    |  |  (o) (o)  |  |    ",
      "    |  |     ^     |  |    ",
      "    |  |   '---'   |  |    ",
      "     \\  \\_________/  /     ",
      "      '.           .'      ",
      "        '-._____.-'        ",
      "           |   |           ",
      "      _____|   |_____      ",
      "     /               \\     ",
      "    /                 \\    "
    ];
    let mx0, my0, mx1, my1, seeds, region, isEdge, maxD;

    function buildMirror(){
      const mw = Math.min(C - 6, Math.max(34, Math.floor(C * 0.52)));
      const mh = Math.min(R - 9, Math.max(FACE.length + 6, Math.floor(R * 0.7)));
      mx0 = Math.floor((C - mw) / 2); mx1 = mx0 + mw;
      my0 = Math.floor((R - mh) / 2) - 1; my1 = my0 + mh;
      const portrait = W < H, gx = portrait ? 2 : 3, gy = portrait ? 3 : 2;
      seeds = [];
      for(let j = 0; j < gy; j++) for(let i = 0; i < gx; i++)
        seeds.push({ x: mx0 + (i + 0.25 + Math.random() * 0.5) * mw / gx, y: my0 + (j + 0.25 + Math.random() * 0.5) * mh / gy });
      const ar = chH / cw;
      region = new Int8Array(C * R).fill(-1);
      for(let r = my0 + 1; r < my1; r++) for(let c = mx0 + 1; c < mx1; c++){
        let best = 0, bd = 1e9;
        seeds.forEach((s, k) => { const d = (c - s.x) ** 2 + ((r - s.y) * ar) ** 2; if(d < bd){ bd = d; best = k; } });
        region[r * C + c] = best;
      }
      isEdge = new Uint8Array(C * R);
      for(let r = my0 + 1; r < my1; r++) for(let c = mx0 + 1; c < mx1; c++){
        const i = r * C + c, a = region[i];
        const dr = region[i + 1] !== a && region[i + 1] >= 0, dd = region[i + C] !== a && region[i + C] >= 0;
        if(dr || dd) isEdge[i] = dr && dd ? 3 : dr ? 1 : 2;
      }
      maxD = Math.hypot(mw, mh * ar);
    }
    const crackChar = (i, c, r) => isEdge[i] === 1 ? '│' : isEdge[i] === 2 ? '─' : (h(c, r) < 0.5 ? '╱' : '╲');

    // fissures en étoile autour d'un point d'impact
    function makeRays(c0, r0, n, len){
      const cells = [];
      for(let k = 0; k < n; k++){
        let a = (k / n) * Math.PI * 2 + Math.random() * 0.5, x = c0, y = r0;
        const L = len * (0.5 + Math.random() * 0.5);
        for(let s = 0; s < L; s++){
          a += (Math.random() - 0.5) * 0.5;
          x += Math.cos(a); y += Math.sin(a) * 0.5;
          const dx = Math.cos(a), dy = Math.sin(a);
          const ch = Math.abs(dy) < 0.38 ? '─' : Math.abs(dx) < 0.38 ? '│' : (dx * dy > 0 ? '╲' : '╱');
          cells.push({ c: Math.round(x), r: Math.round(y), d: s, ch });
        }
      }
      return cells;
    }

    function drawFrame(col){
      for(let c = mx0; c <= mx1; c++){ set(c, my0, '═', col); set(c, my1, '═', col); }
      for(let r = my0; r <= my1; r++){ set(mx0, r, '║', col); set(mx1, r, '║', col); }
      set(mx0, my0, '╔', col); set(mx1, my0, '╗', col); set(mx0, my1, '╚', col); set(mx1, my1, '╝', col);
    }
    // le reflet : une lueur qui glisse + le visage casqué
    function mirrorCell(c, r, t){
      const fr = r - Math.round((my0 + my1) / 2 - FACE.length / 2), fc = c - Math.round((mx0 + mx1) / 2 - FACE[0].length / 2);
      if(fr >= 0 && fr < FACE.length && fc >= 0 && fc < FACE[0].length && FACE[fr][fc] !== ' '){ out(FACE[fr][fc], '#c8d0dc'); return; }
      const v = Math.sin((c * 0.5 + r) * 0.25 - t * 0.8);
      if(v > 0.985 && h(c, r) < 0.6){ out('/', '#3a404c'); return; }
      out(h(c, r) < 0.04 ? '.' : ' ', '#2a2e36');
    }

    /* ---------- état du jeu ---------- */
    let phase = 'mirror', t0 = 0, impact = null, rays = [], hover = -1, chosen = -1;
    let cur = 0, scroll = 0, speed = 14, raceT = 0, spawnIn = 1, obstacles = [], lives = 1;
    let MS = 64, sx = 0, sy = 0, tx = 0, ty = 0, invulUntil = 0, crash = null, shake = 0, stutterT = -1e9;
    let shardScroll = 0, last = performance.now();

    function cellAt(px, py){ return { c: Math.floor(px / cw), r: Math.floor(py / chH) }; }
    function shardOffset(k, sep){
      const s = seeds[k], cx = (mx0 + mx1) / 2, cy = (my0 + my1) / 2;
      const dx = s.x - cx, dy = (s.y - cy) * chH / cw, d = Math.hypot(dx, dy) || 1;
      return { x: Math.round(dx / d * 2 * sep), y: Math.round(dy / d * sep) };
    }
    function fragmentAt(c, r){
      for(let k = 0; k < seeds.length; k++){
        const o = shardOffset(k, 1), sc = c - o.x, sr = r - o.y;
        if(sc > mx0 && sc < mx1 && sr > my0 && sr < my1 && region[sr * C + sc] === k) return k;
      }
      return -1;
    }

    function breakMirror(c, r){
      if(phase !== 'mirror') return;
      impact = { c: clamp(c, mx0 + 2, mx1 - 2), r: clamp(r, my0 + 2, my1 - 2) };
      rays = makeRays(impact.c, impact.r, 10, 12);
      phase = 'crack'; t0 = performance.now(); shake = 1;
    }

    function enterLife(k){
      phase = 'enter'; chosen = k; t0 = performance.now();
      if(current < 0) load(0, true);                           // la musique démarre quand on plonge dans le décor
    }

    function startRace(){
      phase = 'race'; cur = chosen; scroll = 0; speed = 14; raceT = 0; spawnIn = 1.2; obstacles = [];
      sx = tx = W / 2; sy = ty = H * 0.75;
      moto.style.display = 'block';
      playerEl.classList.add('show');
    }

    function spawn(){
      const th = THEMES[cur], def = OBST[th.obst[(Math.random() * th.obst.length) | 0]];
      const wdt = def.s[0].length, L = roadL + th.narrow, Rr = roadR - th.narrow;
      const o = { def, w: -scroll - def.s.length - 1, x: L + Math.random() * Math.max(1, Rr - L - wdt), vx: 0, vw: 0 };
      if(def.kind === 'veh') o.vw = speed * (0.35 + Math.random() * 0.25);
      if(def.kind === 'cross'){
        const fromLeft = Math.random() < 0.5;
        o.x = fromLeft ? L - wdt - 1 : Rr + 1; o.vx = (fromLeft ? 1 : -1) * (4 + Math.random() * 5);
        o.w -= Math.random() * 6;
      }
      obstacles.push(o);
    }

    function doCrash(now){
      lives++; invulUntil = now + 2000; shake = 1; stutterT = now;
      const p = cellAt(sx, sy);
      crash = { t: now, cells: makeRays(p.c, p.r, 14, Math.max(C, R) * 0.7), switched: false };
    }

    /* ---------- entrées ---------- */
    addEventListener('pointermove', e => {
      tx = e.clientX; ty = e.clientY - (e.pointerType === 'touch' ? 70 : 0);   // au doigt, le scooter reste visible au-dessus
      const p = cellAt(e.clientX, e.clientY);
      hover = phase === 'shards' ? fragmentAt(p.c, p.r) : -1;
    });
    cv.addEventListener('pointerdown', e => {
      tx = e.clientX; ty = e.clientY - (e.pointerType === 'touch' ? 70 : 0);
      const p = cellAt(e.clientX, e.clientY);
      if(phase === 'mirror') breakMirror(p.c, p.r);
      else if(phase === 'shards'){ const k = fragmentAt(p.c, p.r); if(k >= 0) enterLife(k); }
    });
    addEventListener('wheel', e => { e.preventDefault(); if(phase === 'mirror') breakMirror((mx0 + mx1) / 2 | 0, (my0 + my1) / 2 | 0); }, { passive:false });
    addEventListener('resize', () => { setup(); if(phase !== 'race'){ phase = 'mirror'; } });

    /* ---------- boucle ---------- */
    function loop(now){
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const t = now / 1000, e = (now - t0) / 1000;
      let yOff = 0, bg = '#000';

      if(phase === 'mirror' || phase === 'crack'){
        for(let r = my0 + 1; r < my1; r++) for(let c = mx0 + 1; c < mx1; c++){ mirrorCell(c, r, t); set(c, r, OC, OK); }
        drawFrame('#c9a54a');
        if(phase === 'mirror'){
          if(Math.floor(t * 1.5) % 2) text('[ touche le miroir ]', Math.round(C / 2 - 10), my1 + 2, '#8a8f9a');
        } else {
          const prog = e / 0.7 * maxD, ar = chH / cw;
          for(let r = my0 + 1; r < my1; r++) for(let c = mx0 + 1; c < mx1; c++){
            const i = r * C + c;
            if(isEdge[i] && Math.hypot(c - impact.c, (r - impact.r) * ar) < prog) set(c, r, crackChar(i, c, r), '#ffffff');
          }
          for(const p of rays) if(p.d < e * 30 && p.c > mx0 && p.c < mx1 && p.r > my0 && p.r < my1) set(p.c, p.r, p.ch, '#ffffff');
          set(impact.c, impact.r, '✶', '#ffffff');
          if(e > 1.0){ phase = 'shards'; t0 = now; }
        }
      }

      else if(phase === 'shards' || phase === 'enter'){
        shardScroll += dt * 5;
        const sep = phase === 'shards' ? Math.min(1, e / 0.5) : 1;
        const dissolve = phase === 'shards' ? e / 1.4 : 9;
        const grow = phase === 'enter' ? Math.min(1, e / 0.9) : 0, ease = grow * grow * (3 - 2 * grow);
        const ar = chH / cw, si = Math.floor(shardScroll);
        const offs = seeds.map((_, k) => shardOffset(k, sep));
        if(phase === 'enter') offs.forEach((o, k) => { if(k !== chosen) o.y += Math.round(0.5 * 60 * e * e); });
        if(phase === 'shards') drawFrame('#c9a54a');
        for(let r = 0; r < R; r++) for(let c = 0; c < C; c++){
          let k = -1, sc = 0, sr = 0;
          if(phase === 'enter' && chosen >= 0 && Math.hypot(c - seeds[chosen].x, (r - seeds[chosen].y) * ar) < ease * maxD * 1.6) { k = chosen; sc = c; sr = r; }
          else for(let q = 0; q < seeds.length; q++){
            const a = c - offs[q].x, b = r - offs[q].y;
            if(a > mx0 && a < mx1 && b > my0 && b < my1 && region[b * C + a] === q){ k = q; sc = a; sr = b; break; }
          }
          if(k < 0) continue;
          const i = sr * C + sc;
          if(isEdge[i] && !(phase === 'enter' && k === chosen)){
            set(c, r, crackChar(i, sc, sr), k === hover ? THEMES[k].accent : '#dfe6ee'); continue;
          }
          if(h(sc, sr) * 0.85 + k * 0.025 > dissolve){ mirrorCell(sc, sr, t); set(c, r, OC, OK); continue; }
          // chaque éclat montre un bord de route + son décor ; en plongeant, la route glisse à sa vraie place
          const edge = THEMES[k].previewLeft ? roadL - 2 : roadR + 1;
          const shift = Math.round((edge - seeds[k].x) * (k === chosen ? 1 - ease : 1));
          raceCell(THEMES[k], sc - shift, sr - si, sr, t);
          set(c, r, OC, k === hover && OC !== ' ' && h(sc + 7, sr) < 0.15 ? THEMES[k].accent : OK);
        }
        if(phase === 'shards' && e > 1.2 && Math.floor(t * 1.5) % 2) text('[ choisis une vie ]', Math.round(C / 2 - 9), my1 + 2, '#8a8f9a');
        if(phase === 'enter'){ bg = THEMES[chosen].bg; if(e > 1.0) startRace(); }
      }

      else if(phase === 'race'){
        const th = THEMES[cur];
        bg = th.bg;
        raceT += dt;
        speed = Math.min(38, 14 + raceT * 0.35);
        scroll += speed * dt;
        const si = Math.floor(scroll), frac = scroll - si;
        yOff = (frac - 1) * chH;
        for(let r = 0; r < R; r++){
          const w = r - 1 - si;
          for(let c = 0; c < C; c++){ raceCell(th, c, w, r, t); if(OC !== ' ') set(c, r, OC, OK); }
        }
        // obstacles
        spawnIn -= dt;
        if(spawnIn <= 0){ spawn(); spawnIn = Math.max(0.28, 1.0 - raceT * 0.012) * (0.6 + Math.random() * 0.8); }
        const hw = MS * 0.18, hh = MS * 0.36;
        for(const o of obstacles){
          o.w -= o.vw * dt; o.x += o.vx * dt;
          const gc = Math.floor(o.x), gr = Math.floor(o.w) + si + 1;
          o.def.s.forEach((line, l) => { for(let k = 0; k < line.length; k++) if(line[k] !== ' ') set(gc + k, gr + l, line[k], o.def.col); });
          const ox = gc * cw, oy = (Math.floor(o.w) + scroll) * chH;
          if(now > invulUntil && !crash &&
             sx + hw > ox && sx - hw < ox + o.def.s[0].length * cw && sy + hh > oy && sy - hh < oy + o.def.s.length * chH) doCrash(now);
        }
        obstacles = obstacles.filter(o => Math.floor(o.w) + si < R + 2 && o.x > -10 && o.x < C + 10);
        // crash : l'écran se fend comme le miroir, puis on bascule dans une autre vie
        if(crash){
          const ce = (now - crash.t) / 1000;
          for(const p of crash.cells) if(p.d < ce * 90) set(p.c, p.r + 1, p.ch, '#ffffff');
          if(ce > 0.45 && !crash.switched){
            crash.switched = true; obstacles = [];
            let n; do { n = (Math.random() * THEMES.length) | 0; } while(n === cur); cur = n;
          }
          if(ce > 0.9) crash = null;
        }
        // scooter
        const k = Math.min(1, dt * 9);
        const dx = tx - sx;
        sx += dx * k; sy += (ty - sy) * k;
        sx = clamp(sx, MS / 2, W - MS / 2); sy = clamp(sy, MS / 2, H - MS / 2);
        const tilt = clamp(dx * 0.25, -28, 28);
        moto.style.transform = `translate(${sx - MS / 2}px, ${sy - MS / 2}px) rotate(${tilt}deg)`;
        moto.style.opacity = now < invulUntil && Math.floor(now / 90) % 2 ? 0.25 : 1;
        // cassette qui accroche après un crash
        const se = (now - stutterT) / 1000;
        audio.playbackRate = se < 0.15 ? 1 - se / 0.15 * 0.7 : se < 0.6 ? 0.3 + (se - 0.15) / 0.45 * 0.7 : 1;
      }

      // rendu
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height);
      let shx = 0, shy = 0;                                    // tremblement au choc
      if(shake > 0){ shx = (Math.random() - .5) * 8 * shake; shy = (Math.random() - .5) * 8 * shake; shake = Math.max(0, shake - dt * 3); }
      flush(shx, yOff + shy);
      if(phase === 'race'){
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.font = 'bold ' + (fs + 1) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillStyle = '#39ff88'; ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 8;
        ctx.fillText(`VIE ${String(lives).padStart(2, '0')}   ${(scroll * 0.004).toFixed(1)} KM`, W / 2, 16);
        ctx.shadowBlur = 0; ctx.textAlign = 'start';
        if(crash && (now - crash.t) < 120){ ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, 0, W, H); }
      }
      requestAnimationFrame(loop);
    }

    setup();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
